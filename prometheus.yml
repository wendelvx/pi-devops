global:
  scrape_interval: 1s     
  evaluation_interval: 1s

scrape_configs:
  # 1. O próprio Prometheus 
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Gateway Node.js
  - job_name: 'node-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['node-gateway:3001']

  # 3. Go Engine
  - job_name: 'go-engine'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['go-engine:8080']