services:
  traefik:
    image: traefik:v2.11
    container_name: dungeon_traefik
    restart: unless-stopped
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - dungeon_net

  redis:
    image: redis:alpine
    container_name: dungeon_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - dungeon_net

  postgres:
    image: postgres:15-alpine
    container_name: dungeon_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=dev
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=dev
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d dev"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - dungeon_net

  node-gateway:
    build: ./gateway-node
    container_name: node_gateway
    restart: unless-stopped
    environment:
      - REDIS_HOST=redis
      - PORT=3001
    expose:
      - "3001"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.node-gateway.rule=Host(`rpg.local`) && (PathPrefix(`/api`) || PathPrefix(`/socket.io`))"
      - "traefik.http.routers.node-gateway.entrypoints=web"
      - "traefik.http.services.node-gateway.loadbalancer.server.port=3001"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - dungeon_net

  go-engine:
    build: ./go-engine
    container_name: go_engine
    restart: unless-stopped
    environment:
      - DB_HOST=postgres
      - DB_USER=dev
      - DB_PASS=1234
      - DB_NAME=dev
      - REDIS_ADDR=redis:6379 
    expose:
      - "8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.go-engine.rule=Host(`rpg.local`) && PathPrefix(`/metrics`)"
      - "traefik.http.routers.go-engine.entrypoints=web"
      - "traefik.http.services.go-engine.loadbalancer.server.port=8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dungeon_net

  prometheus:
    image: prom/prometheus
    container_name: dungeon_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - dungeon_net

  # cloudflare-tunnel:
  #   image: cloudflare/cloudflared:latest
  #   container_name: cloudflare_tunnel
  #   restart: always
  #   # Ajustado para apontar para o container_name correto na rede interna
  #   command: tunnel --url http://node_gateway:3001
  #   networks:
  #     - dungeon_net

networks:
  dungeon_net:
    driver: bridge

volumes:
  pgdata:
    driver: local