services:
  redis:
    image: redis:alpine
    container_name: dungeon_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:15-alpine
    container_name: dungeon_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=dev          
      - POSTGRES_PASSWORD=1234     
      - POSTGRES_DB=dev            
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d dev"]
      interval: 5s
      timeout: 3s
      retries: 5

  node-gateway:
    build: ./gateway-node
    container_name: node_gateway
    restart: unless-stopped
    environment:
      - REDIS_HOST=redis
      - PORT=3001
    ports:
      - "3001:3001"
    depends_on:
      redis:
        condition: service_healthy

  go-engine:
    build: ./go-engine
    container_name: go_engine
    restart: unless-stopped
    environment:
      - DB_HOST=postgres
      - DB_USER=dev
      - DB_PASS=1234
      - DB_NAME=dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Observabilidade
  prometheus:
    image: prom/prometheus
    container_name: dungeon_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

volumes:
  pgdata: