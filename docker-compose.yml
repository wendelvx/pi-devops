services:
  traefik:
    image: traefik:v3.3
    container_name: dungeon_traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "${TRAEFIK_PORT:-80}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  redis:
    image: redis:alpine
    container_name: dungeon_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:15-alpine
    container_name: dungeon_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=dev
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d dev"]
      interval: 5s
      timeout: 3s
      retries: 5

  node-gateway:
    build: ./gateway-node
    container_name: node_gateway
    restart: unless-stopped
    environment:
      - REDIS_HOST=redis
      - PORT=3001
    expose:
      - "3001"
    labels:
      - traefik.enable=true
      - traefik.http.routers.node-gateway.rule=Host(`rpg.local`) && (PathPrefix(`/api`) || PathPrefix(`/socket.io`))
      - traefik.http.routers.node-gateway.entrypoints=web
      - traefik.http.services.node-gateway.loadbalancer.server.port=3001
    depends_on:
      redis:
        condition: service_healthy

  go-engine:
    build: ./go-engine
    container_name: go_engine
    restart: unless-stopped
    environment:
      - DB_HOST=postgres
      - DB_USER=dev
      - DB_PASS=1234
      - DB_NAME=dev
      - REDIS_ADDR=redis:6379 
    expose:
      - "8080"
    labels:
      - traefik.enable=true
      - traefik.http.routers.go-engine.rule=Host(`rpg.local`) && PathPrefix(`/metrics`)
      - traefik.http.routers.go-engine.entrypoints=web
      - traefik.http.services.go-engine.loadbalancer.server.port=8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus
    container_name: dungeon_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090" 

volumes:
  pgdata: